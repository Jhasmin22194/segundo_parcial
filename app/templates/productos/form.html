{% extends "base.html" %}
{% block title %}{{ 'Editar' if producto else 'Nuevo' }} producto · TechBol{% endblock %}
{% block content %}
<h2>{{ 'Editar' if producto else 'Nuevo' }} producto</h2>
<form method="post" class="card card-body shadow-sm">
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input type="text" name="nombre" class="form-control" required value="{{ producto.nombre if producto else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Precio (Bs)</label>
    <input type="number" step="0.01" min="0" name="precio" class="form-control" required value="{{ producto.precio if producto else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Stock</label>
    <input type="number" min="0" name="stock" class="form-control" required value="{{ producto.stock if producto else '' }}">
  </div>
  <div>
    <button class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('productos.lista') }}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
