{% extends "base.html" %}
{% block title %}{{ 'Editar' if pedido else 'Nuevo' }} pedido{% endblock %}
{% block content %}
<h2>{{ 'Editar' if pedido else 'Nuevo' }} pedido</h2>
<form method="post" class="card card-body shadow-sm">
  <div class="mb-3">
    <label class="form-label">Cliente</label>
    <select name="cliente_id" class="form-select" required>
      {% for c in clientes %}
        <option value="{{ c.id }}" {{ 'selected' if pedido and pedido.cliente_id == c.id }}>{{ c.nombre }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Producto</label>
    {% if pedido %}
      <input type="text" class="form-control" value="{{ pedido.producto.nombre }}" disabled>
    {% else %}
      <select name="producto_id" class="form-select" required>
        {% for p in productos %}
          <option value="{{ p.id }}">{{ p.nombre }}</option>
        {% endfor %}
      </select>
    {% endif %}
  </div>
  <div class="mb-3">
    <label class="form-label">Monto (Bs)</label>
    <input type="number" step="0.01" min="0" name="monto" class="form-control"
           value="{{ pedido.monto if pedido else '' }}" {{ 'required' if pedido }}>
    {% if not pedido %}<div class="form-text"></div>{% endif %}
  </div>
  <div>
    <button class="btn btn-warning">Guardar</button>
    <a href="{{ url_for('pedidos.lista') }}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
